name: Publish deploy artifact
run-name: Publish source ${{ inputs.source_sha }} (run ${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character source commit SHA from main history
        required: true
        type: string

permissions:
  contents: read

# One publisher for this branch, regardless of source SHA. Pending runs may be
# replaced by GitHub; an active release is never cancelled by a newer dispatch.
concurrency:
  group: penumbra-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    outputs:
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
    steps:
      - name: Validate dispatch
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      # Tooling comes from the workflow commit, independently of source_sha.
      - name: Check out release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out source history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Select exact source commit from main
        working-directory: source
        run: |
          test "$(git rev-parse "$SOURCE_SHA^{commit}")" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Run tests
        working-directory: source
        run: npm test

      - name: Build production application
        working-directory: source
        run: npm run build -- --manifest

      - name: Check release tooling against this build
        env:
          PENUMBRA_DEPLOY_TEST_SOURCE: ${{ github.workspace }}/source
        run: node --test tooling/tests/deploy/*.node.cjs

      - name: Validate production assets and package release
        id: package
        run: node tooling/scripts/deploy/artifact.cjs create source release

      - name: Transfer verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: penumbra-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Download this run's release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: penumbra-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release

      # No npm install, source scripts, or downloaded executables in this job.
      - name: Reverify and append release to deploy branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/scripts/deploy/publish.cjs release "$RUNNER_TEMP/deploy-repository"
