name: Build validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js for the real release packager fixtures
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Test isolated static installer on Python 3.12
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -B -m unittest discover -s tests/deploy -p 'test_install.py' -v

      - name: Test Ubuntu release helper
        run: |
          command -v ss
          command -v curl
          command -v openssl
          python3 -B -m unittest discover -s tests/deploy -p 'test_release_remote.py' -v

  release-entrypoint:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Test release coordinator with local fixtures
        run: python -B -m unittest discover -s tests/deploy -p 'test_release.py' -v

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Validate production assets and report build
        run: |
          node <<'NODE'
          const { checkBuild } = require('./tests/browser/production-subpath-smoke.cjs');
          console.log(JSON.stringify({ sourceSha: process.env.GITHUB_SHA, ...checkBuild() }, null, 2));
          NODE
