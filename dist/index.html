<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penumbra</title>
    <script>
      (() => {
        try {
          const storedThemeMode = localStorage.getItem("penumbra-theme-mode");
          const themeMode = ["light", "dark", "system"].includes(storedThemeMode)
            ? storedThemeMode
            : "system";
          const isDark = themeMode === "dark"
            || (themeMode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";

          const getForeground = (color) => {
            const r = Number.parseInt(color.slice(1, 3), 16);
            const g = Number.parseInt(color.slice(3, 5), 16);
            const b = Number.parseInt(color.slice(5, 7), 16);
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.64
              ? "#111110"
              : "#ffffff";
          };

          const relativeLuminance = (hex) => {
            const channels = [hex.slice(1, 3), hex.slice(3, 5), hex.slice(5, 7)]
              .map((channel) => Number.parseInt(channel, 16) / 255)
              .map((channel) => channel <= 0.04045
                ? channel / 12.92
                : ((channel + 0.055) / 1.055) ** 2.4);
            return 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
          };
          const contrastRatio = (first, second) => {
            const firstLuminance = relativeLuminance(first);
            const secondLuminance = relativeLuminance(second);
            return (Math.max(firstLuminance, secondLuminance) + 0.05)
              / (Math.min(firstLuminance, secondLuminance) + 0.05);
          };
          const mixHex = (source, target, amount) => {
            const channels = [1, 3, 5].map((start) => {
              const sourceChannel = Number.parseInt(source.slice(start, start + 2), 16);
              const targetChannel = Number.parseInt(target.slice(start, start + 2), 16);
              return Math.round(sourceChannel + (targetChannel - sourceChannel) * amount)
                .toString(16)
                .padStart(2, "0");
            });
            return `#${channels.join("")}`;
          };
          const readableInk = (source, surface, target) => {
            if (contrastRatio(source, surface) >= 5.5) return source;
            for (let step = 1; step <= 25; step += 1) {
              const candidate = mixHex(source, target, step / 25);
              if (contrastRatio(candidate, surface) >= 5.5) return candidate;
            }
            return target;
          };

          const themeColor = localStorage.getItem("penumbra-theme-color");
          if (/^#[0-9a-f]{6}$/i.test(themeColor || "")) {
            document.documentElement.style.setProperty("--color-theme", themeColor);
            document.documentElement.style.setProperty(
              "--color-primary-foreground",
              getForeground(themeColor),
            );
            document.documentElement.style.setProperty(
              "--theme-primary-ink-light",
              readableInk(themeColor, "#FAFAF8", "#1A1A1A"),
            );
            document.documentElement.style.setProperty(
              "--theme-primary-ink-dark",
              readableInk(themeColor, "#1A1A18", "#E8E8E4"),
            );
          }

          const aiColor = localStorage.getItem("penumbra-ai-color");
          if (/^#[0-9a-f]{6}$/i.test(aiColor || "")) {
            document.documentElement.style.setProperty("--ai-theme-color", aiColor);
            document.documentElement.style.setProperty(
              "--ai-theme-foreground",
              getForeground(aiColor),
            );
          }
        } catch {
          // localStorage 不可用时继续使用 CSS 默认主题。
        }
      })();
    </script>
    <script type="module" crossorigin src="/penumbra/assets/index-KyTva3Vi.js"></script>
    <link rel="stylesheet" crossorigin href="/penumbra/assets/index-Dtlgz4mo.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
