<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penumbra</title>
    <script>
      (() => {
        try {
          const color = localStorage.getItem("penumbra-theme-color");
          if (!/^#[0-9a-f]{6}$/i.test(color || "")) return;

          const r = Number.parseInt(color.slice(1, 3), 16);
          const g = Number.parseInt(color.slice(3, 5), 16);
          const b = Number.parseInt(color.slice(5, 7), 16);
          const foreground = (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.64
            ? "#111110"
            : "#ffffff";

          document.documentElement.style.setProperty("--color-theme", color);
          document.documentElement.style.setProperty("--color-primary-foreground", foreground);
        } catch {
          // localStorage 不可用时继续使用 CSS 默认主题。
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
